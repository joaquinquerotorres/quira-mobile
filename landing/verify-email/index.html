<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quira - Verificando correo</title>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f8fafc;
      color: #1e293b;
      display: grid;
      place-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 22px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
      text-align: center;
    }
    h1 { margin: 0 0 10px; font-size: 1.1rem; }
    p { margin: 0 0 16px; color: #64748b; line-height: 1.45; }
    a {
      display: inline-block;
      background: #4f46e5;
      color: #fff;
      text-decoration: none;
      padding: 10px 14px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.92rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Abriendo Quira...</h1>
    <p>Si no se abre automaticamente, pulsa el boton para continuar la verificacion en la app.</p>
    <a id="open-app" href="#">Abrir Quira</a>
  </div>
  <script>
    (function () {
      var token = new URLSearchParams(window.location.search).get('token') || '';
      var appUrl = token
        ? 'com.quira.app://verify-email?token=' + encodeURIComponent(token)
        : 'com.quira.app://verify-email';

      var cta = document.getElementById('open-app');
      if (cta) cta.setAttribute('href', appUrl);

      window.location.replace(appUrl);
      window.setTimeout(function () {
        window.location.replace('/');
      }, 1800);
    })();
  </script>
</body>
</html>
