name: Native build (manual)

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "What to build"
        required: true
        default: "both"
        type: choice
        options:
          - android
          - ios
          - both
      require_ci_success:
        description: "Require CI workflow to be green for this commit"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: read
  actions: read

concurrency:
  group: native-build-${{ github.ref }}
  cancel-in-progress: false

env:
  # Variables: VITE_API_URL, VITE_GOOGLE_MAPS_KEY, VITE_SENTRY_DSN
  # Secrets: ANDROID_GOOGLE_SERVICES_JSON_BASE64, IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64 (Android keystore → native-release only)
  VITE_API_URL: ${{ vars.VITE_API_URL }}
  VITE_GOOGLE_MAPS_KEY: ${{ vars.VITE_GOOGLE_MAPS_KEY }}
  VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
  ANDROID_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON_BASE64 }}
  IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64 }}

jobs:
  android:
    if: ${{ inputs.platform == 'android' || inputs.platform == 'both' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: "Guard: require CI green for this commit"
        if: ${{ inputs.require_ci_success == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Checking CI status for commit: ${SHA}"
          json="$(curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/actions/workflows/ci.yml/runs?head_sha=${SHA}&status=completed&per_page=1")"
          JSON_PAYLOAD="${json}" python3 - <<'PY'
          import json, os, sys
          data = json.loads(os.environ["JSON_PAYLOAD"])
          runs = data.get("workflow_runs") or []
          if not runs:
            print("No completed CI run found for this commit. Wait for CI to finish, then retry.")
            sys.exit(1)
          run = runs[0]
          conclusion = run.get("conclusion")
          url = run.get("html_url")
          print(f"CI run: {url}")
          print(f"CI conclusion: {conclusion}")
          if conclusion != "success":
            print("CI is not green. Aborting native build.")
            sys.exit(1)
          PY

      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate .env (from vars)
        shell: bash
        run: |
          cat > .env <<EOF
          VITE_API_URL=${VITE_API_URL}
          VITE_GOOGLE_MAPS_KEY=${VITE_GOOGLE_MAPS_KEY}
          VITE_SENTRY_DSN=${VITE_SENTRY_DSN}
          EOF

      - name: Restore google-services.json (optional)
        if: ${{ env.ANDROID_GOOGLE_SERVICES_JSON_BASE64 != '' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android/app
          # Strip accidental spaces/newlines from pasted base64; printf avoids echo quirks
          B64="${ANDROID_GOOGLE_SERVICES_JSON_BASE64//[$'\t\r\n ']/}"
          printf '%s' "$B64" | base64 -d > android/app/google-services.json
          python3 -m json.tool android/app/google-services.json > /dev/null
          echo "google-services.json restored ($(wc -c < android/app/google-services.json) bytes, valid JSON)"

      - name: Build web (dist)
        run: npm run build

      - name: Capacitor sync (android)
        run: npx cap sync android

      - name: Gradle assembleDebug (no signing)
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android/app/build/outputs/apk/**/app-*.apk
          if-no-files-found: error
          retention-days: 14

  ios:
    if: ${{ inputs.platform == 'ios' || inputs.platform == 'both' }}
    # Capacitor 8 SPM exige Swift tools 6.x; macos-14/Xcode 15 solo traen Swift 5.10.
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: "Guard: require CI green for this commit"
        if: ${{ inputs.require_ci_success == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Checking CI status for commit: ${SHA}"
          json="$(curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/actions/workflows/ci.yml/runs?head_sha=${SHA}&status=completed&per_page=1")"
          JSON_PAYLOAD="${json}" python3 - <<'PY'
          import json, os, sys
          data = json.loads(os.environ["JSON_PAYLOAD"])
          runs = data.get("workflow_runs") or []
          if not runs:
            print("No completed CI run found for this commit. Wait for CI to finish, then retry.")
            sys.exit(1)
          run = runs[0]
          conclusion = run.get("conclusion")
          url = run.get("html_url")
          print(f"CI run: {url}")
          print(f"CI conclusion: {conclusion}")
          if conclusion != "success":
            print("CI is not green. Aborting native build.")
            sys.exit(1)
          PY

      - name: Checkout
        uses: actions/checkout@v6

      - name: Select Xcode 16 (Swift 6 for Capacitor SPM)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate .env (from vars)
        shell: bash
        run: |
          cat > .env <<EOF
          VITE_API_URL=${VITE_API_URL}
          VITE_GOOGLE_MAPS_KEY=${VITE_GOOGLE_MAPS_KEY}
          VITE_SENTRY_DSN=${VITE_SENTRY_DSN}
          EOF

      - name: Restore GoogleService-Info.plist (optional)
        if: ${{ env.IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64 != '' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ios/App/App
          B64="${IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64//[$'\t\r\n ']/}"
          printf '%s' "$B64" | base64 -d > ios/App/App/GoogleService-Info.plist
          plutil -lint ios/App/App/GoogleService-Info.plist
          echo "GoogleService-Info.plist restored ($(wc -c < ios/App/App/GoogleService-Info.plist) bytes, valid plist)"

      - name: Build web (dist)
        run: npm run build

      - name: Capacitor sync (ios)
        run: npx cap sync ios

      - name: Xcode build (simulator, no signing)
        working-directory: ios/App
        shell: bash
        run: |
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Upload Xcode build logs (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-logs
          path: |
            ~/Library/Logs/DiagnosticReports
          if-no-files-found: ignore
          retention-days: 14

