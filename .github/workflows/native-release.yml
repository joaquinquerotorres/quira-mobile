name: Native release (manual, signed)

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "What to build"
        required: true
        default: "android"
        type: choice
        options:
          - android
          - ios
          - both
      require_ci_success:
        description: "Require CI workflow to be green for this commit"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: read
  actions: read

concurrency:
  group: native-release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Variables: VITE_API_URL, VITE_GOOGLE_MAPS_KEY, VITE_SENTRY_DSN
  # Secrets: ANDROID_GOOGLE_SERVICES_JSON_BASE64, IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64,
  #   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD (used in android job steps)
  VITE_API_URL: ${{ vars.VITE_API_URL }}
  VITE_GOOGLE_MAPS_KEY: ${{ vars.VITE_GOOGLE_MAPS_KEY }}
  VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
  ANDROID_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON_BASE64 }}
  IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64 }}

jobs:
  android:
    if: ${{ inputs.platform == 'android' || inputs.platform == 'both' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: "Guard: require CI green for this commit"
        if: ${{ inputs.require_ci_success == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Checking CI status for commit: ${SHA}"
          json="$(curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/actions/workflows/ci.yml/runs?head_sha=${SHA}&status=completed&per_page=1")"
          JSON_PAYLOAD="${json}" python3 - <<'PY'
          import json, os, sys
          data = json.loads(os.environ["JSON_PAYLOAD"])
          runs = data.get("workflow_runs") or []
          if not runs:
            print("No completed CI run found for this commit. Wait for CI to finish, then retry.")
            sys.exit(1)
          run = runs[0]
          conclusion = run.get("conclusion")
          url = run.get("html_url")
          print(f"CI run: {url}")
          print(f"CI conclusion: {conclusion}")
          if conclusion != "success":
            print("CI is not green. Aborting native release.")
            sys.exit(1)
          PY

      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate .env (from vars)
        shell: bash
        run: |
          cat > .env <<EOF
          VITE_API_URL=${VITE_API_URL}
          VITE_GOOGLE_MAPS_KEY=${VITE_GOOGLE_MAPS_KEY}
          VITE_SENTRY_DSN=${VITE_SENTRY_DSN}
          EOF

      - name: Restore google-services.json (required for release if Firebase used)
        if: ${{ env.ANDROID_GOOGLE_SERVICES_JSON_BASE64 != '' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android/app
          B64="${ANDROID_GOOGLE_SERVICES_JSON_BASE64//[$'\t\r\n ']/}"
          printf '%s' "$B64" | base64 -d > android/app/google-services.json
          python3 -m json.tool android/app/google-services.json > /dev/null
          echo "google-services.json restored ($(wc -c < android/app/google-services.json) bytes, valid JSON)"

      - name: Restore Android keystore (required)
        shell: bash
        run: |
          test -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" || (echo "Missing ANDROID_KEYSTORE_BASE64 secret" && exit 1)
          test -n "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" || (echo "Missing ANDROID_KEYSTORE_PASSWORD secret" && exit 1)
          test -n "${{ secrets.ANDROID_KEY_ALIAS }}" || (echo "Missing ANDROID_KEY_ALIAS secret" && exit 1)
          test -n "${{ secrets.ANDROID_KEY_PASSWORD }}" || (echo "Missing ANDROID_KEY_PASSWORD secret" && exit 1)
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.keystore

      - name: Build web (dist)
        run: npm run build

      - name: Capacitor sync (android)
        run: npx cap sync android

      - name: Gradle bundleRelease (signed AAB)
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: app/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30

  ios:
    if: ${{ inputs.platform == 'ios' || inputs.platform == 'both' }}
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: "Guard: require CI green for this commit"
        if: ${{ inputs.require_ci_success == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Checking CI status for commit: ${SHA}"
          json="$(curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/actions/workflows/ci.yml/runs?head_sha=${SHA}&status=completed&per_page=1")"
          JSON_PAYLOAD="${json}" python3 - <<'PY'
          import json, os, sys
          data = json.loads(os.environ["JSON_PAYLOAD"])
          runs = data.get("workflow_runs") or []
          if not runs:
            print("No completed CI run found for this commit. Wait for CI to finish, then retry.")
            sys.exit(1)
          run = runs[0]
          conclusion = run.get("conclusion")
          url = run.get("html_url")
          print(f"CI run: {url}")
          print(f"CI conclusion: {conclusion}")
          if conclusion != "success":
            print("CI is not green. Aborting native release.")
            sys.exit(1)
          PY

      - name: Checkout
        uses: actions/checkout@v6

      - name: Select Xcode 16 (Swift 6 for Capacitor SPM)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate .env (from vars)
        shell: bash
        run: |
          cat > .env <<EOF
          VITE_API_URL=${VITE_API_URL}
          VITE_GOOGLE_MAPS_KEY=${VITE_GOOGLE_MAPS_KEY}
          VITE_SENTRY_DSN=${VITE_SENTRY_DSN}
          EOF

      - name: Restore GoogleService-Info.plist (optional)
        if: ${{ env.IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64 != '' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ios/App/App
          B64="${IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64//[$'\t\r\n ']/}"
          printf '%s' "$B64" | base64 -d > ios/App/App/GoogleService-Info.plist
          plutil -lint ios/App/App/GoogleService-Info.plist
          echo "GoogleService-Info.plist restored ($(wc -c < ios/App/App/GoogleService-Info.plist) bytes, valid plist)"

      - name: Build web (dist)
        run: npm run build

      - name: Capacitor sync (ios)
        run: npx cap sync ios

      - name: Build IPA (requires signing secrets)
        working-directory: ios/App
        shell: bash
        run: |
          echo "This job is intentionally a template."
          echo "To enable signed IPA builds, configure Apple signing (certs/profiles) and export options."
          echo "Recommended approach: Fastlane match or importing a .p12 + provisioning profile."
          exit 1

