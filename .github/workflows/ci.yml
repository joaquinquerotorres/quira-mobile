name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint
        run: npm run lint -- .

  unit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Unit tests (Vitest)
        run: npm test

  build:
    runs-on: ubuntu-latest
    needs: [lint, unit]
    env:
      VITE_API_URL: ${{ vars.VITE_API_URL }}
      VITE_GOOGLE_MAPS_KEY: ${{ vars.VITE_GOOGLE_MAPS_KEY }}
      VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate .env for build (from vars)
        shell: bash
        run: |
          cat > .env <<'EOF'
          VITE_API_URL=${VITE_API_URL}
          VITE_GOOGLE_MAPS_KEY=${VITE_GOOGLE_MAPS_KEY}
          VITE_SENTRY_DSN=${VITE_SENTRY_DSN}
          EOF

      - name: Build (Vite)
        run: npm run build

      - name: Upload build artifact (dist)
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          if-no-files-found: error
          retention-days: 7

  e2e:
    runs-on: ubuntu-latest
    needs: [build]
    timeout-minutes: 20
    env:
      VITE_API_URL: ${{ vars.VITE_API_URL }}
      VITE_GOOGLE_MAPS_KEY: ${{ vars.VITE_GOOGLE_MAPS_KEY }}
      VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
      ANDROID_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON_BASE64 }}
      IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Cache Cypress binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Generate .env for dev server (from vars)
        shell: bash
        run: |
          cat > .env <<'EOF'
          VITE_API_URL=${VITE_API_URL}
          VITE_GOOGLE_MAPS_KEY=${VITE_GOOGLE_MAPS_KEY}
          VITE_SENTRY_DSN=${VITE_SENTRY_DSN}
          EOF

      # Opcional (solo si algún día añadís build nativo):
      # recrea ficheros reales desde Secrets en base64 si existen.
      - name: Restore Firebase native configs (optional)
        if: ${{ env.ANDROID_GOOGLE_SERVICES_JSON_BASE64 != '' && env.IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64 != '' }}
        shell: bash
        run: |
          echo "${ANDROID_GOOGLE_SERVICES_JSON_BASE64}" | base64 --decode > android/app/google-services.json
          echo "${IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64}" | base64 --decode > ios/App/App/GoogleService-Info.plist

      - name: Cypress run (smoke)
        uses: cypress-io/github-action@v6
        with:
          start: npm run dev -- --host 127.0.0.1 --port 5173
          wait-on: http://127.0.0.1:5173
          wait-on-timeout: 120000
          command: npm run test.e2e -- --spec "cypress/e2e/smoke.cy.ts"

      - name: Upload Cypress artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-artifacts
          path: |
            cypress/screenshots
            cypress/videos
          if-no-files-found: ignore
