name: Quality gate (manual)

on:
  workflow_dispatch:
    inputs:
      e2e:
        description: "Run Cypress full suite"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: false

env:
  VITE_API_URL: ${{ vars.VITE_API_URL }}
  VITE_GOOGLE_MAPS_KEY: ${{ vars.VITE_GOOGLE_MAPS_KEY }}
  CYPRESS_baseUrl: http://127.0.0.1:5173

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate .env (from vars)
        shell: bash
        run: |
          cat > .env <<'EOF'
          VITE_API_URL=${VITE_API_URL}
          VITE_GOOGLE_MAPS_KEY=${VITE_GOOGLE_MAPS_KEY}
          EOF

      - name: Lint
        run: npm run lint -- .

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Cypress full run
        if: ${{ inputs.e2e == 'true' }}
        uses: cypress-io/github-action@v6
        with:
          install-command: npm ci --legacy-peer-deps
          start: npm run dev -- --host 127.0.0.1 --port 5173
          wait-on: http://127.0.0.1:5173
          wait-on-timeout: 120000
          command: npm run test.e2e

      - name: Upload Cypress artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: quality-gate-cypress
          path: |
            cypress/screenshots
            cypress/videos
          if-no-files-found: ignore
          retention-days: 14

